name: build Gmeek

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/Gmeek.yml"
      - "article-order.json"
      - "scripts/customize_homepage.py"
  issues:
    types: [opened, edited]
  schedule:
    - cron: "0 16 * * *"

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        github.event.repository.owner.id == github.event.sender.id
      }}

    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          echo "====== config.json ======"
          cat config.json
          echo "====== config.json end ======"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Clone Gmeek source
        run: |
          GMEEK_VERSION=$(jq -r ".GMEEK_VERSION" config.json)

          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek
          cd /opt/Gmeek

          if [ "$GMEEK_VERSION" = "last" ]; then
            LAST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")
            git checkout "$LAST_TAG"
          else
            git checkout "$GMEEK_VERSION"
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r /opt/Gmeek/requirements.txt
          pip install beautifulsoup4

      - name: Generate HTML
        run: |
          cp -r "${{ github.workspace }}/." /opt/Gmeek/

          cd /opt/Gmeek

          python Gmeek.py \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.repository }}" \
            --issue_number '${{ github.event.issue.number }}'

      - name: Customize generated homepage
        run: python /opt/Gmeek/scripts/customize_homepage.py /opt/Gmeek process

      - name: Verify customized homepage
        run: python /opt/Gmeek/scripts/customize_homepage.py /opt/Gmeek verify

      - name: Copy generated files
        run: |
          rm -rf "${{ github.workspace }}/docs"
          rm -rf "${{ github.workspace }}/backup"

          cp -a /opt/Gmeek/docs "${{ github.workspace }}/"
          cp -a /opt/Gmeek/backup "${{ github.workspace }}/"
          cp /opt/Gmeek/blogBase.json "${{ github.workspace }}/"

      - name: Commit generated files
        run: |
          cd "${{ github.workspace }}"

          git config --local user.email "$(jq -r ".email" config.json)"
          git config --local user.name "${{ github.repository_owner }}"

          git add docs backup blogBase.json

          git commit \
            -m "🎉 auto update by customized Gmeek action" \
            || echo "nothing to commit"

          git push || echo "nothing to push"

          sleep 3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "docs/."

  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04
    needs: build

    permissions:
      contents: write
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
